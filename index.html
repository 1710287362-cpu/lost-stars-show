<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>《迷失的星星》· 作品展示</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <div class="desk">
    <div class="vignette"></div>

    <div class="scene" id="scene">
      <div class="book" id="book">

        <!-- 摊开的书页（底层）：当前跨页内容 -->
        <div class="spread-base" id="spreadBase">
          <img class="spread-img" src="https://cdn.jsdelivr.net/gh/1710287362-cpu/lost-stars-show@main/assets/pages_trim.webp" alt="摊开的旧书" draggable="false">
          <div class="content" id="baseSlot"></div>
          <div class="page-shade" id="pageShade"></div>
        </div>

        <!-- 翻页叶片（右半页）：正面=当前页右半，背面=下一页左半，绕书脊向左翻 -->
        <div class="leaf" id="leaf">
          <div class="leaf-face leaf-front">
            <div class="leaf-paper"></div>
            <div class="leaf-view" id="frontView"></div>
            <div class="leaf-shade"></div>
          </div>
          <div class="leaf-face leaf-back">
            <div class="leaf-paper"></div>
            <div class="leaf-view" id="backView"></div>
            <div class="leaf-shade"></div>
          </div>
        </div>

        <!-- 封面（翻转层）：合上时居中盖在最上方 -->
        <div class="cover-flip" id="coverFlip">
          <img class="cover-img" src="https://cdn.jsdelivr.net/gh/1710287362-cpu/lost-stars-show@main/assets/cover_trim.webp" alt="合上的旧书" draggable="false">
          <div class="cover-shade" id="coverShade"></div>
        </div>

      </div>

      <div class="dots" id="dots"></div>
      <div class="hint" id="hint">轻点或向左拖动 · 翻开这本书</div>
    </div>
  </div>

  <script src="book.js?v=20"></script>
</body>
</html>
